name: MuseTalk ordered tracking CPU contracts

# Lightweight, standard public runner only. No package/model downloads, GPU,
# credentials, registry publication, remote host mutations or rented resources.
on:
  push:
    branches: [codex/rtx3090-r5-delivery]
    paths:
      - .github/workflows/musetalk-tracking-overlap-contracts.yml
      - scripts/chin_multistream/tracking_overlap.py
      - scripts/chin_multistream/worker.py
      - scripts/chin_multistream/telemetry.py
      - scripts/chin_multistream_cpu_telemetry.py
      - scripts/repro_3090/test_cpu_window_telemetry.py
      - scripts/repro_3090/watch_owned_single_leaf_565.py
      - scripts/repro_3090/test_watch_owned_single_leaf_565.py
      - scripts/repro_3090/build_owned_unet_opt3.py
      - scripts/repro_3090/test_build_owned_unet_opt3.py
      - scripts/repro_3090/prepare_owned_cpu_inputs.py
      - scripts/repro_3090/test_prepare_owned_cpu_inputs.py
      - scripts/chin_multistream_render.py
      - scripts/avatar_manager_parallel.py
      - test_avatar_model_startup.py
      - scripts/repro_3090/runner.py
      - scripts/repro_3090/report.py
      - scripts/repro_3090/test_tracking_overlap.py
      - scripts/repro_3090/test_repro_3090.py
      - scripts/repro_3090/tracking_parity.py
      - scripts/repro_3090/test_tracking_parity.py
      - scripts/repro_3090/fetch_dependency_ci_evidence.py
      - scripts/repro_3090/test_fetch_dependency_ci_evidence.py
      - scripts/repro_3090/run_owned_3090_with_runtime_credentials.py
      - scripts/repro_3090/test_owned_3090_credentials.py
      - scripts/repro_3090/freeze_tracking_lineage.py
      - scripts/repro_3090/test_tracking_lineage.py
      - scripts/repro_3090/safe_capture.py
      - scripts/repro_3090/test_safe_capture.py
      - scripts/repro_3090/avatar_latent_candidate.py
      - scripts/repro_3090/test_avatar_latent_candidate.py
      - scripts/repro_3090/a2_power_comparison.py
      - scripts/repro_3090/test_a2_power_comparison.py
      - scripts/repro_3090/preserve_a2_evidence.py
      - scripts/repro_3090/test_preserve_a2_evidence.py
      - scripts/repro_3090/taesd_final_conv_fp32.py
      - scripts/repro_3090/test_taesd_final_conv_fp32.py
      - scripts/repro_3090/taesd_fp32_candidate_runtime.py
      - scripts/repro_3090/test_taesd_fp32_candidate_runtime.py
      - scripts/repro_3090/taesd_fp32_candidate_child.py
      - scripts/repro_3090/test_taesd_fp32_candidate_child.py
      - scripts/repro_3090/taesd_fp32_candidate_quality.py
      - scripts/repro_3090/test_taesd_fp32_candidate_quality.py
      - scripts/repro_3090/preregister_metadata_quality_lineage.py
      - scripts/repro_3090/test_preregister_metadata_quality_lineage.py
      - scripts/repro_3090/ec2_startup_runner.py
      - scripts/repro_3090/50_startup.py
      - test_startup_observer.py

permissions:
  contents: read

concurrency:
  group: musetalk-tracking-cpu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cpu-contracts:
    if: github.repository == 'AhmadAFS1/MuseTalk'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python 3.10 overlap, preparation, power and preservation CPU contracts
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: scripts/repro_3090
        shell: bash
        run: |
          set -euo pipefail
          command -v python3.10
          python3.10 -B -m unittest discover -s scripts/repro_3090 -p test_tracking_overlap.py -v
          python3.10 -B -m unittest discover -s scripts/repro_3090 -p test_repro_3090.py -v
          python3.10 -B -m unittest discover -s scripts/repro_3090 -p test_tracking_parity.py -v
          python3.10 -B -m unittest discover -s scripts/repro_3090 -p test_fetch_dependency_ci_evidence.py -v
          python3.10 -B -m unittest discover -s scripts/repro_3090 -p test_owned_3090_credentials.py -v
          python3.10 -B -m unittest discover -s scripts/repro_3090 -p test_tracking_lineage.py -v
          python3.10 -B -m unittest discover -s scripts/repro_3090 -p test_safe_capture.py -v
          # Stdlib provenance/ownership tests always run. Numerical comparison
          # tests use preinstalled NumPy when available; otherwise explicitly skip.
          # Do not install model/runtime dependencies in this lightweight job.
          python3.10 -B -m unittest discover -s scripts/repro_3090 -p test_avatar_latent_candidate.py -v
          # Simulated power/restore and cloud/archive contracts only. These tests
          # never invoke GPU hardware, SSH, AWS, credentials or cloud mutations.
          python3.10 -B -m unittest discover -s scripts/repro_3090 -p test_a2_power_comparison.py -v
          python3.10 -B -m unittest discover -s scripts/repro_3090 -p test_preserve_a2_evidence.py -v
          # Pure graph/topology tests; real ONNX checks explicitly skip when the
          # package is absent. No engine build or precision acceptance implied.
          python3.10 -B -m unittest discover -s scripts/repro_3090 -p test_taesd_final_conv_fp32.py -v
          # Explicit candidate API contracts use mocked TRT/CUDA and synthetic
          # artifacts only; import never builds, loads or registers a GPU path.
          python3.10 -B -m unittest discover -s scripts/repro_3090 -p test_taesd_fp32_candidate_runtime.py -v
          # Lazy scoped routing must leave CPU spawn workers free of GPU imports;
          # numerical gate failures remain failures. No real engine is loaded.
          python3.10 -B -m unittest discover -s scripts/repro_3090 -p test_taesd_fp32_candidate_child.py -v
          python3.10 -B -m unittest discover -s scripts/repro_3090 -p test_taesd_fp32_candidate_quality.py -v
          # Explicit metadata-only ancestry keeps all original quality bounds;
          # these are synthetic CPU contracts, not an actual preregistration.
          python3.10 -B -m unittest discover -s scripts/repro_3090 -p test_preregister_metadata_quality_lineage.py -v
          # Bound expiry deadlines are checked before credentials/provider calls.
          python3.10 -B -m unittest test_startup_observer -v
          # Actual manager method bodies with synthetic CPU model/backend mocks;
          # no CUDA initialization, real quality or startup-speed claim.
          python3.10 -B -m unittest test_avatar_model_startup -v
          # Current-cgroup counters and resets are synthetic; no throttling or
          # host-cause claim follows from CPU test success.
          python3.10 -B -m unittest discover -s scripts/repro_3090 -p test_cpu_window_telemetry.py -v
          # Same exact ownership protocol with an explicitly versioned driver
          # comparison; CUDA/NVML behavior is mocked, never hardware accepted.
          python3.10 -B -m unittest discover -s scripts/repro_3090 -p 'test_watch_owned_single_leaf*.py' -v
          python3.10 -B -m unittest discover -s scripts/repro_3090 -p test_build_owned_unet_opt3.py -v
          python3.10 -B -m unittest discover -s scripts/repro_3090 -p test_prepare_owned_cpu_inputs.py -v
          # Read-only actual runner counter availability, not GPU/host performance.
          python3.10 -B -c "import sys,json;sys.path.insert(0,'scripts');from chin_multistream.telemetry import cgroup_cpu_snapshot;print('CPU_CGROUP '+json.dumps(cgroup_cpu_snapshot(),sort_keys=True))"
