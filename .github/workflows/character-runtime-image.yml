name: Private character preparation runtime candidate
on:
  push:
    branches: [codex/character-device-release]
    paths: [.github/character-runtime-build-request.json]
permissions:
  contents: read
concurrency:
  group: character-runtime-private-image
  cancel-in-progress: false
jobs:
  candidate:
    if: github.repository == 'AhmadAFS1/MuseTalk'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate exact source request
        id: request
        run: |
          python3 - <<'PY'
          import json,os,re
          d=json.load(open('.github/character-runtime-build-request.json'))
          assert set(d)=={'source_revision'} and re.fullmatch('[0-9a-f]{40}',d['source_revision'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('revision='+d['source_revision']+'\n')
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.request.outputs.revision }}
          persist-credentials: false
      - name: Make room for the pinned CUDA environments
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /
      - name: Build private exact-source image and verify offline CPU manifest
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          CHARACTER_RUNTIME_PRIVATE_BUILD_INPUTS: ${{ secrets.CHARACTER_RUNTIME_PRIVATE_BUILD_INPUTS }}
          BUILD_REVISION: ${{ steps.request.outputs.revision }}
        run: |
          python3 -B docker/character-runtime/private_ci.py --revision "$BUILD_REVISION" --work "$RUNNER_TEMP/character-runtime"
      - name: Preserve non-secret candidate receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: character-runtime-candidate
          path: |
            ${{ runner.temp }}/character-runtime/candidate.json
            ${{ runner.temp }}/character-runtime/runtime-manifest.json
          retention-days: 7
          if-no-files-found: warn
      - name: Remove ephemeral registry authentication
        if: always()
        run: docker logout ghcr.io
