# xcodegen spec for the MuseTalk timing harness app.
#   brew install xcodegen && (cd ios/MuseTalkBench/App && xcodegen generate)
# The HarnessBundle folder (compiled models + gate captures) is generated by
# scripts/ios/prepare_harness_bundle.py and bundled as a folder reference.
name: MuseTalkBench
options:
  bundleIdPrefix: com.lingua
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
settings:
  base:
    DEVELOPMENT_TEAM: 563AETFKT9
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
packages:
  HarnessCore:
    path: ..
targets:
  MuseTalkBench:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: ../HarnessBundle
        type: folder
        buildPhase: resources
    dependencies:
      - package: HarnessCore
        product: HarnessCore
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: MuseTalk Bench
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lingua.musetalkbench
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        ENABLE_PREVIEWS: NO
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
